<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléchargeur de Playlist Spotify</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #181818;
            --surface2: #282828;
            --text: #ffffff;
            --text2: #b3b3b3;
            --accent: #1db954;
            --accent-hover: #1ed760;
            --error: #f15e6c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: var(--surface);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .logo svg { width: 40px; height: 40px; }
        h1 { font-size: 1.8em; font-weight: 700; text-align: center; }
        .subtitle {
            text-align: center;
            color: var(--text2);
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .input-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 0.85em;
            color: var(--text2);
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--surface2);
            border: 1px solid #3e3e3e;
            border-radius: 8px;
            color: var(--text);
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent); }
        input[type="text"]::placeholder { color: #6a6a6a; }
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #555; color: #999; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.9em;
        }
        .status.info { display: block; background: #1a3a2a; color: var(--accent); }
        .status.error { display: block; background: #3a1a1a; color: var(--error); }
        .track-list {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--surface2);
            border-radius: 8px;
            padding: 10px;
        }
        .track-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid #3e3e3e;
            font-size: 0.85em;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item .index { color: var(--text2); min-width: 25px; }
        .track-item .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-item .dl-btn {
            padding: 5px 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
        }
        .track-item .dl-btn:hover { background: var(--accent-hover); }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            border-radius: 3px;
        }
        .error-msg {
            color: var(--error);
            font-size: 0.8em;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="#1db954">
                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.56.3z"/>
            </svg>
            <h1>Spotify Downloader</h1>
        </div>
        <p class="subtitle">Collez le lien d'une playlist Spotify publique pour la télécharger</p>
        
        <div class="input-group">
            <label for="playlistUrl">URL de la playlist Spotify</label>
            <input type="text" id="playlistUrl" placeholder="https://open.spotify.com/playlist/..." />
            <div class="error-msg" id="urlError">Veuillez entrer une URL Spotify valide</div>
        </div>
        
        <button class="btn" id="fetchBtn">Récupérer la playlist</button>
        
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="track-list" id="trackList" style="display:none;"></div>
        
        <button class="btn" id="downloadAllBtn" style="display:none; margin-top:15px; background:#535353; color:#fff;" onclick="downloadAllTracks()">Télécharger tout (ZIP)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        let playlistTracks = [];
        let playlistName = 'playlist';
        let currentAudioBlob = null;
        
        // Fonction pour extraire l'ID de la playlist depuis l'URL
        function extractPlaylistId(url) {
            if (!url) return null;
            const patterns = [
                /playlist\/([a-zA-Z0-9]+)/,
                /playlist%3A([a-zA-Z0-9]+)/,
                /^([a-zA-Z0-9]{22})$/
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match && match[1]) return match[1];
            }
            return null;
        }
        
        // Récupérer les données de la playlist via l'API publique de Spotify
        async function fetchPlaylistData(playlistId) {
            try {
                // Essayer l'API publique sans token
                const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}`, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 401 || response.status === 403) {
                    // Besoin d'un token, essayer de l'obtenir
                    const token = await getSpotifyToken();
                    const authResponse = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!authResponse.ok) throw new Error(`Erreur API Spotify: ${authResponse.status}`);
                    return await authResponse.json();
                }
                
                if (!response.ok) throw new Error(`Erreur API Spotify: ${response.status}`);
                return await response.json();
            } catch (error) {
                // Fallback: utiliser l'API embed
                const embedResponse = await fetch(`https://open.spotify.com/embed/playlist/${playlistId}`);
                if (embedResponse.ok) {
                    const html = await embedResponse.text();
                    // Extraire les données JSON de l'embed
                    const jsonMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">(.*?)<\/script>/s);
                    if (jsonMatch && jsonMatch[1]) {
                        const data = JSON.parse(jsonMatch[1]);
                        const playlistData = data.props?.pageProps?.playlist;
                        if (playlistData) return playlistData;
                    }
                }
                throw error;
            }
        }
        
        // Obtenir un token Spotify public
        async function getSpotifyToken() {
            try {
                const response = await fetch('https://open.spotify.com/get_access_token?reason=transport&productType=web_player');
                if (!response.ok) throw new Error('Impossible d\'obtenir le token');
                const data = await response.json();
                return data.accessToken;
            } catch (e) {
                // Fallback: récupérer depuis la page d'accueil
                const htmlResponse = await fetch('https://open.spotify.com/');
                const html = await htmlResponse.text();
                const tokenMatch = html.match(/"accessToken":"([a-zA-Z0-9_-]+)"/);
                if (tokenMatch && tokenMatch[1]) {
                    return tokenMatch[1];
                }
                throw new Error('Token Spotify introuvable');
            }
        }
        
        // Récupérer la playlist
        async function fetchPlaylist(playlistId) {
            const data = await fetchPlaylistData(playlistId);
            
            playlistName = data.name || 'playlist';
            playlistTracks = [];
            
            let tracks;
            if (data.tracks && data.tracks.items) {
                tracks = data.tracks.items;
            } else if (data.items) {
                tracks = data.items;
            } else {
                throw new Error('Format de playlist non reconnu');
            }
            
            // Traiter les pistes
            for (const item of tracks) {
                const track = item.track || item;
                if (track && track.name) {
                    playlistTracks.push({
                        name: track.name,
                        artist: track.artists ? track.artists.map(a => a.name).join(', ') : (track.artist || 'Artiste inconnu'),
                        duration: track.duration_ms || 0,
                        album: track.album ? track.album.name : ''
                    });
                }
            }
            
            // Gérer la pagination
            if (data.tracks && data.tracks.next) {
                let nextUrl = data.tracks.next;
                while (nextUrl) {
                    const token = await getSpotifyToken();
                    const pageResponse = await fetch(nextUrl, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    const pageData = await pageResponse.json();
                    
                    for (const item of pageData.items) {
                        if (item.track && item.track.name) {
                            playlistTracks.push({
                                name: item.track.name,
                                artist: item.track.artists.map(a => a.name).join(', '),
                                duration: item.track.duration_ms,
                                album: item.track.album.name
                            });
                        }
                    }
                    nextUrl = pageData.next;
                }
            }
            
            return playlistTracks;
        }
        
        // Rechercher sur YouTube et obtenir l'URL audio
        async function searchAndGetAudioUrl(query) {
            // Méthode 1: Utiliser l'API de recherche YouTube
            const videoId = await searchYouTube(query);
            if (!videoId) throw new Error('Vidéo non trouvée');
            
            // Obtenir l'URL audio via plusieurs services
            return await getAudioUrl(videoId);
        }
        
        // Recherche YouTube
        async function searchYouTube(query) {
            // Essayer plusieurs méthodes de recherche
            const methods = [
                // Méthode 1: API de suggestion YouTube
                async () => {
                    const response = await fetch(`https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    if (data && data[1] && data[1].length > 0) {
                        // Rechercher la vidéo réelle
                        const searchResponse = await fetch(`https://www.youtube.com/results?search_query=${encodeURIComponent(query + ' official audio')}`);
                        const html = await searchResponse.text();
                        const videoIds = [];
                        const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/g;
                        let match;
                        while ((match = regex.exec(html)) !== null) {
                            if (!videoIds.includes(match[1])) {
                                videoIds.push(match[1]);
                                if (videoIds.length >= 1) break;
                            }
                        }
                        return videoIds[0] || null;
                    }
                    return null;
                },
                // Méthode 2: Recherche directe
                async () => {
                    const response = await fetch(`https://www.youtube.com/results?search_query=${encodeURIComponent(query + ' audio')}`);
                    const html = await response.text();
                    const videoIds = [];
                    const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/g;
                    let match;
                    while ((match = regex.exec(html)) !== null) {
                        if (!videoIds.includes(match[1])) {
                            videoIds.push(match[1]);
                            if (videoIds.length >= 1) break;
                        }
                    }
                    return videoIds[0] || null;
                },
                // Méthode 3: Extraction alternative
                async () => {
                    const response = await fetch(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`);
                    const html = await response.text();
                    const regex = /\/watch\?v=([a-zA-Z0-9_-]{11})/g;
                    const videoIds = [];
                    let match;
                    while ((match = regex.exec(html)) !== null) {
                        if (!videoIds.includes(match[1])) {
                            videoIds.push(match[1]);
                            if (videoIds.length >= 1) break;
                        }
                    }
                    return videoIds[0] || null;
                }
            ];
            
            for (const method of methods) {
                try {
                    const result = await method();
                    if (result) return result;
                } catch (e) {
                    continue;
                }
            }
            
            return null;
        }
        
        // Obtenir l'URL audio depuis un service de conversion
        async function getAudioUrl(videoId) {
            const services = [
                {
                    name: 'co.wuk.sh',
                    url: `https://co.wuk.sh/api/json?url=https://www.youtube.com/watch?v=${videoId}`,
                    extract: (data) => data.url || data.download_url || data.link
                },
                {
                    name: 'api.vevioz.com',
                    url: `https://api.vevioz.com/api/button/mp3/${videoId}`,
                    extract: (data) => data.link || data.url || data.download_url
                },
                {
                    name: 'yt-api.com',
                    url: `https://yt-api.com/api/v1/download?id=${videoId}`,
                    extract: (data) => data.url || data.download_url || data.link || data.audio_url
                }
            ];
            
            for (const service of services) {
                try {
                    const response = await fetch(service.url);
                    if (response.ok) {
                        const data = await response.json();
                        const url = service.extract(data);
                        if (url) return url;
                    }
                } catch (e) {
                    continue;
                }
            }
            
            // Méthode alternative: utiliser l'API invidious
            try {
                const invidiousResponse = await fetch(`https://inv.nadeko.net/api/v1/videos/${videoId}`);
                if (invidiousResponse.ok) {
                    const data = await invidiousResponse.json();
                    if (data.adaptiveFormats) {
                        const audioFormat = data.adaptiveFormats.find(f => f.type && f.type.includes('audio'));
                        if (audioFormat && audioFormat.url) {
                            return audioFormat.url;
                        }
                    }
                }
            } catch (e) {
                // Ignorer
            }
            
            // Méthode alternative: utiliser l'API piped
            try {
                const pipedResponse = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                if (pipedResponse.ok) {
                    const data = await pipedResponse.json();
                    if (data.audioStreams && data.audioStreams.length > 0) {
                        return data.audioStreams[0].url;
                    }
                }
            } catch (e) {
                // Ignorer
            }
            
            throw new Error('Aucun service de conversion disponible');
        }
        
        // Télécharger l'audio
        async function downloadAudio(url, filename) {
            try {
                const response = await fetch(url, {
                    mode: 'cors',
                    headers: {
                        'Accept': 'audio/*'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Erreur de téléchargement: ${response.status}`);
                }
                
                const blob = await response.blob();
                return blob;
            } catch (error) {
                // Essayer avec un proxy CORS
                try {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                    const proxyResponse = await fetch(proxyUrl);
                    if (proxyResponse.ok) {
                        const blob = await proxyResponse.blob();
                        return blob;
                    }
                } catch (proxyError) {
                    // Ignorer
                }
                
                throw new Error('Impossible de télécharger l\'audio (CORS)');
            }
        }
        
        // Fonction pour télécharger un blob
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Fonction principale pour récupérer et afficher la playlist
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const urlInput = document.getElementById('playlistUrl');
            const url = urlInput.value.trim();
            const urlError = document.getElementById('urlError');
            const status = document.getElementById('status');
            const trackList = document.getElementById('trackList');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            urlError.style.display = 'none';
            
            const playlistId = extractPlaylistId(url);
            if (!playlistId) {
                urlError.style.display = 'block';
                return;
            }
            
            status.className = 'status info';
            status.textContent = 'Récupération de la playlist...';
            status.style.display = 'block';
            progressBar.style.display = 'block';
            progressFill.style.width = '10%';
            
            try {
                const tracks = await fetchPlaylist(playlistId);
                progressFill.style.width = '80%';
                
                trackList.innerHTML = '';
                trackList.style.display = 'block';
                
                tracks.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = 'track-item';
                    item.innerHTML = `
                        <span class="index">${index + 1}</span>
                        <span class="title">${track.name} - ${track.artist}</span>
                        <button class="dl-btn" onclick="downloadSingleTrack(${index})">Télécharger</button>
                    `;
                    trackList.appendChild(item);
                });
                
                status.textContent = `Playlist "${playlistName}" récupérée : ${tracks.length} pistes`;
                downloadAllBtn.style.display = 'block';
                progressFill.style.width = '100%';
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                }, 500);
                
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Erreur : ${error.message}`;
                progressBar.style.display = 'none';
            }
        });
        
        // Télécharger une seule piste
        async function downloadSingleTrack(index) {
            const track = playlistTracks[index];
            if (!track) return;
            
            const status = document.getElementById('status');
            status.className = 'status info';
            status.textContent = `Recherche de "${track.name} - ${track.artist}"...`;
            
            try {
                const audioUrl = await searchAndGetAudioUrl(`${track.name} ${track.artist}`);
                
                status.textContent = `Téléchargement de "${track.name}"...`;
                const blob = await downloadAudio(audioUrl, `${track.name} - ${track.artist}.mp3`);
                
                downloadBlob(blob, `${track.name} - ${track.artist}.mp3`);
                
                status.textContent = `"${track.name}" téléchargé !`;
                status.className = 'status info';
                
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Erreur pour "${track.name}" : ${error.message}`;
            }
        }
        
        // Télécharger toutes les pistes en ZIP
        async function downloadAllTracks() {
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            if (playlistTracks.length === 0) {
                status.className = 'status error';
                status.textContent = 'Aucune piste à télécharger';
                return;
            }
            
            status.className = 'status info';
            status.textContent = 'Téléchargement de toutes les pistes...';
            progressBar.style.display = 'block';
            progressFill.style.width = '5%';
            
            try {
                const zip = new JSZip();
                const folder = zip.folder(playlistName);
                let successCount = 0;
                
                for (let i = 0; i < playlistTracks.length; i++) {
                    const track = playlistTracks[i];
                    status.textContent = `Traitement ${i + 1}/${playlistTracks.length} : ${track.name}`;
                    progressFill.style.width = `${(i / playlistTracks.length) * 90}%`;
                    
                    try {
                        const audioUrl = await searchAndGetAudioUrl(`${track.name} ${track.artist}`);
                        const blob = await downloadAudio(audioUrl, `${track.name} - ${track.artist}.mp3`);
                        folder.file(`${track.name} - ${track.artist}.mp3`, blob);
                        successCount++;
                        
                        // Petite pause pour éviter de surcharger les API
                        await new Promise(resolve => setTimeout(resolve, 500));
                    } catch (e) {
                        console.warn(`Échec pour ${track.name}: ${e.message}`);
                    }
                }
                
                progressFill.style.width = '95%';
                status.textContent = `Création du fichier ZIP (${successCount}/${playlistTracks.length} pistes)...`;
                
                const zipBlob = await zip.generateAsync({type: 'blob'});
                downloadBlob(zipBlob, `${playlistName}.zip`);
                
                progressFill.style.width = '100%';
                status.textContent = `Téléchargement terminé ! ${successCount} pistes sur ${playlistTracks.length}`;
                status.className = 'status info';
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                }, 500);
                
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Erreur : ${error.message}`;
                progressBar.style.display = 'none';
            }
        }
        
        // Permettre l'appui sur Entrée
        document.getElementById('playlistUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('fetchBtn').click();
            }
        });
    </script>
</body>
</html>
